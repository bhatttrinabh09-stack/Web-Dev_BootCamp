<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-layout">
    <header class="dash-header">
      <div class="logo">AnalyticsPulse</div>
      <div class="user-badge">Admin User</div>
    </header>

    <main class="dash-main">
      <!-- 1. Metric Cards -->
      <section class="metrics-grid">
        <div class="metric-card">
          <span class="metric-title">Total Revenue</span>
          <span class="metric-val">$45,210</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Active Users</span>
          <span class="metric-val">2,420</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Conversion Rate</span>
          <span class="metric-val">3.6%</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Support Tickets</span>
          <span class="metric-val">12</span>
        </div>
      </section>

      <!-- 2. Main Content Split: Chart & Activity -->
      <div class="content-split">
        <section class="chart-panel">
          <h2>Revenue Over Time</h2>
          <div class="chart-placeholder">[Interactive Chart Visual]</div>
        </section>

        <section class="activity-panel">
          <h2>Recent Activity</h2>
          <ul class="activity-list">
            <li>User <strong>@sarah</strong> subscribed to Pro</li>
            <li>New order <strong>#8921</strong> received</li>
            <li>Server update completed</li>
          </ul>
        </section>
      </div>
    </main>

    <footer class="dash-footer">
      <p>&copy; 2026 AnalyticsPulse Dashboard</p>
    </footer>
  </div>
</body>
</html>
