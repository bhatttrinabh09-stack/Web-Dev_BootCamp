<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card & Box Model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <main class="profile-card">
      <img 
        class="avatar" 
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" 
        alt="Portrait of Sarah Lin"
      >
      <h1 class="user-name">Sarah Lin</h1>
      <p class="user-role">Full-Stack Engineer</p>
      <p class="user-bio">
        Passionate about web accessibility, design systems, and building scalable cloud services.
      </p>

      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-number">48</span>
          <span class="stat-label">Projects</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">1.2k</span>
          <span class="stat-label">Followers</span>
        </div>
      </div>

      <button id="connect-btn" class="btn btn-primary">Connect</button>
    </main>
  </div>
</body>
</html>
