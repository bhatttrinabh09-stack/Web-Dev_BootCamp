    legend { font-weight: 600; padding: 0 0.5rem; }
    .radio-label { font-weight: normal; margin-left: 0.5rem; }
    button { background: #005fcc; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 4px; cursor: pointer; }

  </style>
